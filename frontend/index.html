<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swordbattle.io Leaderboards</title>
<style>
  :root {
    --gold: #d4af37;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
  }
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  #background-cycle,
  #background-cycle-2 {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center;
    filter: saturate(1.1);
    transition: opacity 4s ease-in-out;
    opacity: 0;
  }
  #background-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at top, rgba(0,0,0,0.45), rgba(0,0,0,0.85));
    pointer-events: none;
  }
  body { font-family: Arial, sans-serif; background: #111; color: #eee; padding: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; }
  th, td { border: 1px solid #444; padding: 8px; text-align: left; }
  th { background: #222; cursor: pointer; }
  tr:nth-child(even) { background: #1a1a1a; }
  tr.rank-1 { background: rgba(212, 175, 55, 0.25); }
  tr.rank-2 { background: rgba(192, 192, 192, 0.2); }
  tr.rank-3 { background: rgba(205, 127, 50, 0.2); }
  select { margin-left: 20px; padding: 4px; }
  h1 { margin-top: 20px; }
  .tabs { margin-top: 20px; }
  .tab-button { background: #222; color: #eee; border: none; padding: 10px 20px; cursor: pointer; margin-right: 5px; }
  .tab-button.active { background: #555; }
  .tab-content { display: none; margin-top: 20px; }
  .tab-content.active { display: block; }
  .slider-container { margin-top: 10px; }
  .sb-header {
    text-align: center;
    margin: 20px 0;
  }

  .sb-header img {
    height: 80px;
    image-rendering: crisp-edges;
  }
  .leaderboard-wrapper {
    position: relative;
    padding-top: 10px;
  }
  .leaderboard-crown {
    position: absolute; 
    top: -18px;
    left: -10px;
    width: 54px;
    height: auto;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
    transform: rotate(-8deg);
  }
</style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-WS8WYQHC00"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-WS8WYQHC00');
</script>


</head>
<body>
<header class="sb-header">
  <img src="/assets/Swordbattle_Logo.png" alt="Swordbattle.io" />
</header>
<div id="background-cycle" aria-hidden="true"></div>
<div id="background-cycle-2" aria-hidden="true"></div>
<div id="background-overlay" aria-hidden="true"></div>
<h1>Swordbattle.io Leaderboards</h1>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-button active" data-tab="playersTab">Players</button>
  <button class="tab-button" data-tab="gamesTab">Games</button>
  <button class="tab-button" data-tab="searchTab">Search Player</button>
  <button class="tab-button" data-tab="clanTab">Clan Search</button>
</div>

<!-- Players Tab -->
<div id="playersTab" class="tab-content active">
  <label>Time Range:
    <select id="playersTimeRange">
      <option value="all">All Time</option>
      <option value="day">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
    </select>
  </label>

  <p>*Click headers to sort leaderboard</p>
  <div class="leaderboard-wrapper">
    <img class="leaderboard-crown" src="/assets/crown.png" alt="Crown" />
    <table id="playersLeaderboard">
	    <thead>
		    <tr>
			    <th>Place</th>
			    <th onclick="sortTable(1, 'playersLeaderboard')" style="cursor:pointer;">Username</th>
			    <th onclick="sortTable(2, 'playersLeaderboard')" style="cursor:pointer;">XP</th>
			    <th onclick="sortTable(3, 'playersLeaderboard')" style="cursor:pointer;">Playtime</th>
			    <th onclick="sortTable(4, 'playersLeaderboard')" style="cursor:pointer;">Coins</th>
			    <th onclick="sortTable(5, 'playersLeaderboard')" style="cursor:pointer;">Kills</th>
		    </tr>
	    </thead>
	  <tbody></tbody>
    </table>
  </div>
</div>

<!-- Games Tab -->
<div id="gamesTab" class="tab-content">
  <label>Time Range:
    <select id="gamesTimeRange">
      <option value="all">All Time</option>
      <option value="day">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
    </select>
  </label>

  <div class="slider-container">
    <label>Max runs per player: <span id="sliderValue">5</span></label>
    <input type="range" id="maxRunsSlider" min="1" max="11" value="5">
    <span>(11 = All Runs)</span>
  </div>

  <div class="leaderboard-wrapper">
    <img class="leaderboard-crown" src="/assets/crown.png" alt="Crown" />
    <table id="gamesLeaderboard">
	  <thead>
		  <tr>
			  <th>Place</th>
			  <th onclick="sortTable(1, 'gamesLeaderboard')" style="cursor:pointer;">Username</th>
			  <th onclick="sortTable(2, 'gamesLeaderboard')" style="cursor:pointer;">Coins</th>
			  <th onclick="sortTable(3, 'gamesLeaderboard')" style="cursor:pointer;">Kills</th>
			  <th onclick="sortTable(4, 'gamesLeaderboard')" style="cursor:pointer;">Playtime</th>
			  <th onclick="sortTable(5, 'gamesLeaderboard')" style="cursor:pointer;">Date</th>
		  </tr>
	  </thead>
	  <tbody></tbody>
    </table>
  </div>
</div>

<!-- Search Player Tab -->
<div id="searchTab" class="tab-content">
    <label>Search Player:
        <input type="text" id="playerSearchInput" placeholder="Enter username">
        <button id="playerSearchBtn">Search</button>
    </label>
    <div id="playerProfileDisplay" style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;"></div>
</div>

<style>
    .player-card {
        background: #1a1a1a;
        border: 1px solid #444;
        padding: 15px;
        border-radius: 8px;
    }
    .player-card p {
        margin: 8px 0;
    }
    .player-card strong {
        color: #fff;
    }
</style>

<!-- Clan Search Tab -->
<div id="clanTab" class="tab-content">
  <label>
    Clan Name:
    <input type="text" id="clanSearchInput" placeholder="Enter clan name">
    <button id="clanSearchBtn">Search</button>
  </label>

  <div class="leaderboard-wrapper">
    <img class="leaderboard-crown" src="/assets/crown.png" alt="Crown" />
    <table id="clanLeaderboard">
	  <thead>
		  <tr>
		    <th>Place</th>
			  <th onclick="sortTable(1, 'clanLeaderboard')" style="cursor:pointer;">Username</th>
			  <th onclick="sortTable(2, 'clanLeaderboard')" style="cursor:pointer;">XP</th>
			  <th onclick="sortTable(3, 'clanLeaderboard')" style="cursor:pointer;">Gems</th>
			  <th onclick="sortTable(4, 'clanLeaderboard')" style="cursor:pointer;">Mastery</th>
			  <th onclick="sortTable(5, 'clanLeaderboard')" style="cursor:pointer;">Profile Views</th>
		  </tr>
	  </thead>
	  <tbody></tbody>
    </table>
  </div>
</div>


<script>
  // ---------- Tab switching ----------
  const tabButtons = document.querySelectorAll(".tab-button");
  const tabContents = document.querySelectorAll(".tab-content");
  tabButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      tabButtons.forEach(b => b.classList.remove("active"));
      tabContents.forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  // ---------- Players Leaderboard ----------
  async function loadPlayers() {
    const timeRange = document.getElementById("playersTimeRange").value;
    try {
        const res = await fetch(`https://swordbattle-data.onrender.com/stats/fetch?timeRange=${timeRange}&sortBy=xp`, {
            method: "POST"
        });

        console.log("FETCH URL:", `https://swordbattle-data.onrender.com/stats/fetch?timeRange=${timeRange}&sortBy=xp`);

        const data = await res.json();
        const tbody = document.querySelector("#playersLeaderboard tbody");
        tbody.innerHTML = "";
        data.forEach(player => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td></td>
                <td>${player.username}</td>
                <td>${player.xp}</td>
                <td>${formatHMS(player.playtime)}</td>
                <td>${player.coins}</td>
                <td>${player.kills}</td>
            `;
            tbody.appendChild(row);
        });
        assignPlaces("playersLeaderboard");
    } catch(err) {
        console.error("Failed to load players:", err);
    }
  }


  const tableSortState = {}; // remembers asc/desc per table & column

	function sortTable(colIndex, tableId) {
		const table = document.getElementById(tableId);
		const tbody = table.tBodies[0];
		const rows = Array.from(tbody.rows);

		// toggle sort direction per table + column
		const key = `${tableId}-${colIndex}`;
		tableSortState[key] = !tableSortState[key];
		const asc = tableSortState[key];

		rows.sort((a, b) => {
			let aVal = a.cells[colIndex].innerText.trim();
			let bVal = b.cells[colIndex].innerText.trim();

			// Playtime columns (assumes last column in table)
			if (colIndex === rows[0].cells.length - 1) {
				aVal = parseHMS(aVal);
				bVal = parseHMS(bVal);
			} else {
				// Numeric conversion (XP, Coins, Kills)
				aVal = parseFloat(aVal.replace(/,/g, "")) || 0;
				bVal = parseFloat(bVal.replace(/,/g, "")) || 0;
			}

			return asc ? aVal - bVal : bVal - aVal;
		});

		// Re-append sorted rows & reset places (# column)
		tbody.innerHTML = "";
		rows.forEach((row, i) => {
			row.cells[0].innerText = `#${i + 1}`;
			tbody.appendChild(row);
		});
	}

  // ---------- Games Leaderboard ----------
  let gamesData = [];

  async function loadGames() {
    const timeRange = document.getElementById("gamesTimeRange").value;
    try {
      const res = await fetch(`https://swordbattle-data.onrender.com/games/fetch?timeRange=${timeRange}`, { method: "POST" });
      console.log("FETCH URL:", `https://swordbattle-data.onrender.com/games/fetch?timeRange=${timeRange}`);
      gamesData = await res.json();
      updateGamesLeaderboard();
    } catch(err) { console.error("Failed to load games:", err); }
  }

  function updateGamesLeaderboard() {
    const tbody = document.querySelector("#gamesLeaderboard tbody");
    tbody.innerHTML = "";
    const maxRuns = parseInt(document.getElementById("maxRunsSlider").value);
    const runsByPlayer = {};

    gamesData.forEach(game => {
      const username = game.username;
      if (!(username in runsByPlayer)) runsByPlayer[username] = 0;

      if (maxRuns === 11 || runsByPlayer[username] < maxRuns) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td></td>
          <td>${game.username}</td>
          <td>${game.coins}</td>
          <td>${game.kills}</td>
          <td>${formatHMS(game.playtime)}</td>
          <td>${new Date(game.date).toLocaleString()}</td>
        `;
        tbody.appendChild(row);
        runsByPlayer[username]++;
      }
    });
    assignPlaces("gamesLeaderboard");
  }

  // ---------- Clan Searching ----------
document.getElementById("clanSearchBtn").addEventListener("click", async () => {
  const clan = document.getElementById("clanSearchInput").value.trim();
  const tbody = document.querySelector("#clanLeaderboard tbody");
  tbody.innerHTML = "";

  if (!clan) {
    tbody.innerHTML = "<tr><td colspan='6'>Enter a clan name.</td></tr>";
    return;
  }

  const url = `https://swordbattle-data.onrender.com/profile/clanMembers?clan=${encodeURIComponent(clan)}`;
  console.log("FETCH URL:", url);

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Request failed: ${res.status}`);

    const data = await res.json();
    console.log("RAW clan response:", data);

    // IMPORTANT: API returns an object, members is the array
    if (!Array.isArray(data.members) || data.members.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6'>No members found.</td></tr>";
      return;
    }

    data.members.forEach((player, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>#${index + 1}</td>
        <td>${player.username}</td>
        <td>${player.xp ?? 0}</td>
        <td>${player.gems ?? 0}</td>
        <td>${player.mastery ?? 0}</td>
        <td>${player.profile_views ?? 0}</td>
      `;
      tbody.appendChild(row);
    });

  } catch (err) {
    console.error("Clan fetch error:", err);
    tbody.innerHTML = "<tr><td colspan='6'>Failed to load clan.</td></tr>";
  }
});


  //

  // ---------- Helpers ----------
  function assignPlaces(tableId) {
    const rows = document.querySelectorAll(`#${tableId} tbody tr`);
    rows.forEach((row,index) => {
      row.cells[0].innerText = `#${index+1}`;
      row.classList.remove("rank-1", "rank-2", "rank-3");
      if (index === 0) row.classList.add("rank-1");
      if (index === 1) row.classList.add("rank-2");
      if (index === 2) row.classList.add("rank-3");
    });
  }

  function formatHMS(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600)/60);
    const s = seconds % 60;
    return `${h}h ${m}m ${s}s`;
  }

  function parseHMS(hms) {
    const match = hms.match(/(\d+)h (\d+)m (\d+)s/);
    if (!match) return 0;
    return parseInt(match[1])*3600 + parseInt(match[2])*60 + parseInt(match[3]);
  }

document.getElementById("playerSearchBtn").addEventListener("click", async () => {
    const username = document.getElementById("playerSearchInput").value.trim();
    if (!username) {
        document.getElementById("playerProfileDisplay").innerText = "Please enter a username.";
        return;
    }

    try {
        const res = await fetch(`https://swordbattle-data.onrender.com/profile/getPublicUserInfo/${encodeURIComponent(username)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
        });
        console.log("FETCH URL:", `https://swordbattle-data.onrender.com/profile/getPublicUserInfo/${encodeURIComponent(username)}`);
        if (!res.ok) throw new Error("API response not ok");
        const data = await res.json();
        const player = data.account || {};
        const stats = data.totalStats || {};
        
        if (!player || !player.username) {
            document.getElementById("playerProfileDisplay").innerText = "Player not found.";
            return;
        }

        const skinsInfo = player.skins && player.skins.equipped ? `<p><strong>Equipped Skin:</strong> ${player.skins.equipped}</p><p><strong>Owned Skins:</strong> ${player.skins.owned ? player.skins.owned.length : 0}</p>` : "";
        document.getElementById("playerProfileDisplay").innerHTML = `
            <div class="player-card">
                <p><strong>Username:</strong> ${player.username || "N/A"}</p>
                <p><strong>Clan:</strong> ${player.clan || "N/A"}</p>
                <p><strong>XP:</strong> ${stats.xp || 0}</p>
                <p><strong>Mastery:</strong> ${stats.mastery || 0}</p>
                <p><strong>Coins:</strong> ${stats.coins || 0}</p>
                <p><strong>Kills:</strong> ${stats.kills || 0}</p>
                <p><strong>Games:</strong> ${stats.games || 0}</p>
                <p><strong>Playtime:</strong> ${formatHMS(stats.playtime || 0)}</p>
                <p><strong>Gems:</strong> ${player.gems || 0}</p>
                <p><strong>Created At:</strong> ${player.created_at ? new Date(player.created_at).toLocaleString() : "N/A"}</p>
                ${skinsInfo}
            </div>
        `;
    } catch(err) {
        console.error(err);
        document.getElementById("playerProfileDisplay").innerText = "Failed to load profile. Please try again.";
    }
});

  // ---------- Event listeners ----------
  document.getElementById("playersTimeRange").addEventListener("change", loadPlayers);
  document.getElementById("gamesTimeRange").addEventListener("change", loadGames);
  document.getElementById("maxRunsSlider").addEventListener("input", () => {
    document.getElementById("sliderValue").innerText = document.getElementById("maxRunsSlider").value === "11" ? "All" : document.getElementById("maxRunsSlider").value;
    updateGamesLeaderboard();
  });

  // Initial load
  const backgroundImages = [
    "/assets/Swordbattle_bg1.png",
    "/assets/Swordbattle_bg2.png",
    "/assets/Swordbattle_bg3.png"
  ];
  let currentBackground = 0;
  const backgroundEls = [
    document.getElementById("background-cycle"),
    document.getElementById("background-cycle-2")
  ];
  let activeBg = 0;
 
  function cycleBackground() {
    const nextBg = 1 - activeBg;
    currentBackground = (currentBackground + 1) % backgroundImages.length;

    backgroundEls[nextBg].style.backgroundImage = `url('${backgroundImages[currentBackground]}')`;
    backgroundEls[nextBg].style.opacity = "1";
    backgroundEls[activeBg].style.opacity = "0";

    activeBg = nextBg;
  }

  if (backgroundImages.length > 0) {
    backgroundEls[0].style.backgroundImage = `url('${backgroundImages[0]}')`;
    backgroundEls[0].style.opacity = "1";
    backgroundEls[1].style.opacity = "0";
    setInterval(cycleBackground, 16000);
  }
 
  loadPlayers();
  loadGames();
</script>
</body>
</html>
